<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three people, three apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,50&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
:root{--paper:#FBF6EE;--card:#FFFFFF;--ink:#26211C;--ink2:#5B5249;--line:#E5DACB;--sage:#2F6B57;--sage-soft:#E3EFE8;--tomato:#A8331A;--ok:#2E6F42;--ok-soft:#E4F1E6;--lid-blue:#2F5FA7;--lid-yellow:#E8B12F;--display:'Fraunces',Georgia,serif;--body:'Atkinson Hyperlegible','Noto Sans',system-ui,sans-serif}
body{margin:0}
a{color:#2F6B57}a:hover{color:#1F4A3C}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: var(--paper); color: var(--ink); font-family: var(--body); padding: 32px 48px; display: flex; flex-direction: column; gap: 24px">
  <header style="display: flex; align-items: baseline; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-family: var(--display); font-size: 34px; font-weight: 650">Same address. Different software, because it’s a different person.</h1><span style="font: 600 16px ui-monospace, Menlo, monospace; color: var(--ink2)">village.app/v/reyes &nbsp;·&nbsp; one site &nbsp;·&nbsp; three people &nbsp;·&nbsp; each phone knows who’s holding it</span></div>
    <span style="font-size: 16px; color: var(--ink2)">Built and tested in Daytona · checked by Anchor · live</span>
  </header>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; flex-grow: 1">

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 320px; height: 620px; box-sizing: border-box; border-radius: 40px; border: 10px solid var(--ink); background: var(--paper); padding: 22px 16px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-family: var(--display); font-size: 32px; font-weight: 650; line-height: 1.05">Hola, Carmen</span>
        <span style="border: 2px solid var(--ok); border-radius: 16px; padding: 12px; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 9px; background: var(--lid-blue); flex: none"></span>Noche: anotadas 8:02</span>
        <span style="min-height: 92px; border-radius: 20px; background: var(--ok); color: #fff; font-size: 25px; font-weight: 700; display: flex; align-items: center; padding: 0 18px">Ya me la tomé</span>
        <span style="min-height: 92px; border-radius: 20px; background: var(--sage-soft); border: 3px solid var(--sage); font-size: 25px; font-weight: 700; display: flex; align-items: center; padding: 0 18px">Llamar a Ana</span>
        <span style="min-height: 92px; border-radius: 20px; background: var(--tomato); color: #fff; font-size: 25px; font-weight: 700; display: flex; align-items: center; padding: 0 18px">Necesito ayuda</span>
      </div>
      <figcaption style="text-align: center; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 700">Carmen</span><span style="font-size: 16px; color: var(--ink2)">recognized by her phone number · Spanish · 3 buttons · read aloud · no chat</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 320px; height: 620px; box-sizing: border-box; border-radius: 40px; border: 10px solid var(--ink); background: var(--paper); padding: 20px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
        <span style="font-family: var(--display); font-size: 22px; font-weight: 650">Mamá tonight</span>
        <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><span style="background: var(--card); border-radius: 10px; padding: 8px"><span style="display: block; font-size: 18px; font-weight: 700">2/2</span>doses</span><span style="background: var(--card); border-radius: 10px; padding: 8px"><span style="display: block; font-size: 18px; font-weight: 700">Marco</span>on duty</span><span style="background: var(--card); border-radius: 10px; padding: 8px"><span style="display: block; font-size: 18px; font-weight: 700">0</span>missed</span></span>
        <span style="background: var(--card); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 700">Her pill organizer</span><span style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px"><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow)"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow)"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-yellow)"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue)"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue); opacity: 0.35"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue)"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue)"></span><span style="height: 14px; border-radius: 3px; background: var(--lid-blue)"></span></span></span>
        <span style="background: var(--card); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">Rota this week</span><span>Tue Marco · Wed Ana · Thu Marco · Fri Ana</span></span>
        <span style="background: var(--card); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">What happened</span><span>8:02 PM check-in answered</span><span>Sat refill list sent to Marco</span><span style="color: var(--ink2)">Oct 3 lisinopril 5 → 10 mg</span></span>
        <span style="background: var(--card); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">Refills</span><span>Atorvastatin due Oct 24 · Lucía</span></span>
      </div>
      <figcaption style="text-align: center; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 700">Ana</span><span style="font-size: 16px; color: var(--ink2)">recognized by her invite link · leader · dashboard, chat, approvals</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 320px; height: 620px; box-sizing: border-box; border-radius: 40px; border: 10px solid var(--ink); background: var(--paper); padding: 26px 18px; display: flex; flex-direction: column; gap: 18px">
        <span style="font-size: 16px; color: var(--ink2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">Is it my turn?</span>
        <span style="font-family: var(--display); font-size: 40px; font-weight: 650; line-height: 1.05">Yes. Tonight until 9:30.</span>
        <span style="font-size: 19px; line-height: 1.4">Mamá took her evening pills at 8:02. Nothing to do unless Village calls you.</span>
        <span style="margin-top: auto; min-height: 64px; border-radius: 16px; background: var(--sage); color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center">Call Mamá</span>
        <span style="min-height: 56px; border-radius: 16px; border: 2px solid var(--ink); font-size: 18px; font-weight: 700; display: grid; place-items: center">Swap Thursday with Ana</span>
      </div>
      <figcaption style="text-align: center; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 700">Marco</span><span style="font-size: 16px; color: var(--ink2)">recognized by his invite link · works nights · one question, one tap</span></figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
